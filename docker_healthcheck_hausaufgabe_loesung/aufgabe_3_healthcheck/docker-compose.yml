# Aufgabe 3: Healthcheck hinzufuegen
# This file must be named docker-compose.yml so Docker Compose can find it automatically.

# services contains all containers managed by Docker Compose.
services:
  # web is the service name.
  web:
    # nginx is the image for a simple web server.
    image: nginx

    # Aufgabe 3 uses host port 8081 so it does not conflict with Aufgabe 2 on 8080.
    ports:
      - "8081:80"

    # healthcheck tells Docker how to check if the container is really healthy.
    healthcheck:
      # This command checks the web server inside the container.
      test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]

      # Docker runs the healthcheck every 10 seconds.
      interval: 10s

      # Docker waits up to 5 seconds for the command.
      timeout: 5s

      # Docker tries 3 times before marking the container as unhealthy.
      retries: 3

      # Docker gives the container 10 seconds startup time before judging failures.
      start_period: 10s
